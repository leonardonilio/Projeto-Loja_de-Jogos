<!DOCTYPE html>

<html lang="Pt-br">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Categorias</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- bibliotecas do css -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <!-- Bootstrap-->
    <link href="../static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/vendor/bootstrap/css/swiper-bundle.min.css" rel="stylesheet">
    <!--css-->
    <link rel="stylesheet" th:href="@{/assents/css/loader.css}">
    <link rel="stylesheet" th:href="@{/assents/css/style.css}">
    <link rel="stylesheet" th:href="@{/assents/css/footer.css}">

    <!-- Swiper Js-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!--fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- ***** Preloader Start ***** -->
    <div id="js-preloader" class="js-preloader">
        <div class="preloader-inner">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    <!-- ***** Preloader End ***** -->

    <!-- ***** Header *****-->
    <header class="header">
        <div class="header-line">

            <div class="logo">
                <a href="index.html">Umbrella Games</a>
            </div>
            <i class="bx bx-menu" id="menu-icon"></i>
            <div class="search-box">
                <input type="text" placeholder="Buscar jogos...">
                <button><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-search" viewBox="0 0 16 16">
                        <path
                            d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                    </svg></button>
            </div>

            <nav class="nav-links">
                <div class="dropdown">
                    <button>Categorias ▾</button>
                    <div class="dropdown-content">
						<a th:each="cat : ${categorias}"
                           th:href="@{/categoria/{id}(id=${cat.idCategoria})}"
						   th:text="${cat.nomeCategoria}">
						</a>
                    </div>
                </div>

                <div class="dropdown">
                    <button>Desenvolvedora ▾</button>
                    <div class="dropdown-content">
                        <a href="desenvolvedora.html">Ubisoft</a>
                        <a href="desenvolvedora.html">EA</a>
                    </div>
                </div>

                <a href="sobre.html">Sobre</a>
                <a href="#">Admin</a>
                <a class="icon" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16">
                        <path
                            d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2" />
                    </svg></a>
            </nav>

        </div>
    </header>
    <!-- ***** Header End *****-->
  <div class="page-heading header-text">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h3>Categorias</h3>
          <span class="breadcrumb"><a href="index.html">Home</a> > Categorias</span>
        </div>
      </div>
    </div>
  </div>
    <!--****** Top categories *****-->
    <section class="category-feature">

        <h2 class="category-title" th:text="${categoria.nomeCategoria}"></h2>

        <div class="feature-container">

            <!-- imagem grande -->
            <a class="feature-image"
				 th:href="@{'/jogo/' + ${destaqueJogos[0].idJogo}}">
                <img id="feature-img" th:src="@{/assents/img/image.png}">
            </a>

            <!-- painel de informações -->
            <div class="feature-info">

                <h3 id="game-title"></h3>

                <p id="game-description"></p>
            
                <div class="game-rating" id="game-rating"></div>

                <div class="game-price" id="game-price"></div>

            </div>

        </div>

        <!-- lista de jogos -->
         <div class="feature-list">

		 <div class="feature-item" onclick="changeGame(0)"
		      th:if="${destaqueJogos.size() > 0 and destaqueJogos[0].imagem != null}"
			  th:attr="data-title=${destaqueJogos[0].nomeJogo},
			                data-description=${destaqueJogos[0].detalhes},
			                data-price=${destaqueJogos[0].valor},
							data-rating=${destaqueJogos[0].nota},
			                data-image=${#strings.replace(destaqueJogos[0].imagem, '/resources', '')}">
		     <img th:if="${destaqueJogos[0].imagem != null}"
		          th:src="@{${#strings.replace(destaqueJogos[0].imagem, '/resources', '')}}">
		 </div>

		 <div class="feature-item" onclick="changeGame(1)"
		      th:if="${destaqueJogos.size() > 1 and destaqueJogos[1].imagem != null}"
			  th:attr="data-title=${destaqueJogos[1].nomeJogo},
			                data-description=${destaqueJogos[1].detalhes},
			                data-price=${destaqueJogos[1].valor},
							data-rating=${destaqueJogos[1].nota},
			                data-image=${#strings.replace(destaqueJogos[1].imagem, '/resources', '')}">
		     <img th:if="${destaqueJogos[1].imagem != null}"
		          th:src="@{${#strings.replace(destaqueJogos[1].imagem, '/resources', '')}}">
		 </div>

		 <div class="feature-item" onclick="changeGame(2)"
		      th:if="${destaqueJogos.size() > 2 and destaqueJogos[2].imagem != null}"
			  th:attr="data-title=${destaqueJogos[2].nomeJogo},
			  		         data-description=${destaqueJogos[2].detalhes},
			  		         data-price=${destaqueJogos[2].valor},
			  			     data-rating=${destaqueJogos[2].nota},
			  		         data-image=${#strings.replace(destaqueJogos[2].imagem, '/resources', '')}">
		     <img th:if="${destaqueJogos[2].imagem != null}"
		          th:src="@{${#strings.replace(destaqueJogos[2].imagem, '/resources', '')}}">
		 </div>

		 <div class="feature-item" onclick="changeGame(3)"
		      th:if="${destaqueJogos.size() > 3 and destaqueJogos[3].imagem != null}"
			  th:attr="data-title=${destaqueJogos[3].nomeJogo},
			  		          data-description=${destaqueJogos[3].detalhes},
			  		          data-price=${destaqueJogos[3].valor},
			  				  data-rating=${destaqueJogos[3].nota},
			  		          data-image=${#strings.replace(destaqueJogos[3].imagem, '/resources', '')}">
		     <img th:if="${destaqueJogos[3].imagem != null}"
		          th:src="@{${#strings.replace(destaqueJogos[3].imagem, '/resources', '')}}">
		 </div>
			    
            
    <button class="feature-arrow left">❮</button>
    <button class="feature-arrow right">❯</button>
        </div>

    </section>
    <!--****** Top categories end ******-->

    <!--****** popular section ******-->

    <h2 class="category-title">TÍTULOS POPULARES</h2>
    <section class="popular-section">

        <div class="popular-slider swiper">

            <div class="swiper-button-prev"></div>
			<div class="swiper-button-next"></div>

            <div class="swiper-wrapper">

                <!-- SLIDE -->
                <div class="swiper-slide popular-slide"
				th:each="i : ${#numbers.sequence(0, jogos.size() - 1, 5)}">

				<div class="popular-grid">

				            
				            <div class="popular-top">

				                <!-- Item 1 -->
				                <a class="game-big"
									th:href="@{'/jogo/' + ${jogos[i].idJogo}}">
									<img th:src="${jogos.size() > i 
									    ? #strings.replace(jogos[i].imagem, '/resources', '') 
									    : '/assents/img/image.png'}">
				                    <span class="price" th:text="${jogos.size() > i ? jogos[i].valor : ''}"></span>
				                </a>

				                <!-- Item 2 -->
				                <a class="game-big"
									th:href="@{'/jogo/' + ${jogos[i].idJogo}}">
									<img th:src="${jogos.size() > i+1 
									    ? #strings.replace(jogos[i+1].imagem, '/resources', '') 
									    : '/assents/img/image.png'}">
				                    <span class="price" th:text="${jogos.size() > i+1 ? jogos[i+1].valor : ''}"></span>
				                </a>
								
				            </div>
                        <!-- LINHA DE BAIXO -->
                        <div class="popular-bottom">
							
							   <!-- Item 3 -->
							   <a class="game-small"
								th:href="@{'/jogo/' + ${jogos[i].idJogo}}">
								<img th:src="${jogos.size() > i+2 
								    ? #strings.replace(jogos[i+2].imagem, '/resources', '') 
								    : '/assents/img/image.png'}">
							       <span class="price" th:text="${jogos.size() > i+2 ? jogos[i+2].valor : ''}"></span>
							   </a>
							   <!-- Item 4 -->
							   <a class="game-small"
								th:href="@{'/jogo/' + ${jogos[i].idJogo}}">
								<img th:src="${jogos.size() > i+3 
								    ? #strings.replace(jogos[i+3].imagem, '/resources', '') 
								    : '/assents/img/image.png'}">
							       <span class="price" th:text="${jogos.size() > i+3 ? jogos[i+3].valor : ''}"></span>
							   </a>
							   <!-- Item 5 -->
							   <a class="game-small"
								th:href="@{'/jogo/' + ${jogos[i].idJogo}}">
								<img th:src="${jogos.size() > i+4 
								    ? #strings.replace(jogos[i+4].imagem, '/resources', '') 
								    : '/assents/img/image.png'}">
							       <span class="price" th:text="${jogos.size() > i+4 ? jogos[i+4].valor : ''}"></span>
							   </a>

					    </div>

				</div>

		</div>

</div>
    </section>
    <!--****** popular section end ******-->

    <!-- ===== SEÇÃO PRODUTOS ===== -->
    <section class="games-section">

        <!-- Jogos Recomendados -->
        <h2 class="section-title">Mais jogos recomendados da categoria</h2>
        <div class="games-container">

            <div class="games-slider swiper recommended-slider">
                <div class="swiper-button-prev"></div>
                <div class="swiper-wrapper">

					<!-- CARD -->
					<a class="game-card swiper-slide"
					     th:each="i : ${#numbers.sequence(0, 9)}"
						 th:href="${i < jogos.size()
						         ? '/jogo/' + jogos[i].idJogo
						         : '#'}">
						 

					    <!-- Imagem -->
					    <img th:src="${i < jogos.size()
					        ? #strings.replace(jogos[i].imagem, '/resources', '')
					        : '/assents/img/image.png'}">

					    <!-- Nome -->
					    <h3 th:text="${i < jogos.size()
					        ? jogos[i].nomeJogo
					        : 'Sem jogo'}"></h3>

					    <!-- Preço -->
					    <p class="price" th:text="${i < jogos.size()
					        ? jogos[i].valor
					        : ''}"></p>
							
							</a>

					</div>

                <div class="swiper-scrollbar"></div>
                <div class="swiper-button-next"></div>

        </div>

        <!-- Jogos em promoção -->

        <h2 class="section-title">Jogos em promoção da categoria</h2>

        <div class="games-slider swiper promo-slider">
            <div class="swiper-button-prev"></div>
            <div class="swiper-wrapper">

				<!-- CARD -->
				<a class="game-card swiper-slide"
					 th:each="i : ${#numbers.sequence(0, 9)}"
					 th:href="${i < jogos.size()
					         ? '/jogo/' + jogos[i].idJogo
					         : '#'}">

				<!-- Imagem -->
				<img th:src="${i < jogos.size()
					 ? #strings.replace(jogos[i].imagem, '/resources', '')
					 : '/assents/img/image.png'}">

				<!-- Nome -->
				<h3 th:text="${i < jogos.size()
					? jogos[i].nomeJogo
					: 'Sem jogo'}"></h3>

				<!-- Preço -->
				<p class="price" th:text="${i < jogos.size()
				   ? jogos[i].valor
				   : ''}"></p>
											
			</a>

	</div>

<div class="swiper-scrollbar"></div>
<div class="swiper-button-next"></div>

</div>

    </section>
    <!-- ===== SEÇÃO PRODUTOS end ===== -->


    <!-- ********** footer ********** -->

    <footer class="footer">
        <div class="social-icons">
            <a href="#">
                <i class="bx bxl-github"></i>
            </a>
            <a href="#">
                <i class="bx bxl-linkedin"></i>
            </a>
            <a href="#">
                <i class="bx bxl-instagram"></i>
            </a>
            <a href="#">
                <i class="bx bxl-facebook"></i>
            </a>
            <a href="#">
                <i class="bx bxl-twitter"></i>
            </a>
        </div>

        <ul class="list">
            <li>
                <a href="Categoria.html">Categorias</a>
            </li>
            <li>
                <a href="desenvolvedora.html">Desenvolvedoras</a>
            </li>
            <li>
                <a href="sobre.html">Sobre</a>
            </li>
            <li>
                <a href="#contact">Adiministrador</a>
            </li>
        </ul>

        <p class="copyright">getGroup. ©Todos os direitos reservados. 2026</p>
    </footer>

    <!-- ********** footer end ********** -->

    <!--***** Script *****-->
    <!--Código de funcionalidades-->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../static/vendor/jquery/jquery.min.js"></script>
    <script src="../static/vendor/bootstrap/js/bootstrap.min.js"></script>
    <!--Codigo de Javascript-->
    <script th:src="@{/assents/js/function.js}"></script>
    <script th:src="@{/assents/js/script.js}"></script>
</body>

</html>
