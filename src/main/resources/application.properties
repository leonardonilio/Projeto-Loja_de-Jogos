# CONFIGURAÇÃO PARA MYSQL (não MariaDB!)
spring.datasource.url=jdbc:mariadb://localhost:3306/umbrella_games
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configurações do JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.flyway=TRACE
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG